server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Serve static assets, return 404 if not found (prevents soft 404s)
    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets caching (_astro build files and fonts)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Custom 404 error page routing to Astro 404.html
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
